name: Database Migrations

# Applies db/migrations to the production Neon branch with dbmate, after the same migrations
# have applied cleanly to a throwaway copy of production.
on:
  push:
    branches:
      - main
    paths:
      - 'db/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations at once, and never cancel one partway
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  # A copy of production, deleted afterwards: catches a migration that fails against the real
  # schema (including Neon Auth's tables) before production sees it
  rehearse:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Neon branch
        run: >-
          python3 scripts/neon_branch.py create
          --parent production
          --name migrate-${{ github.run_id }}-${{ github.run_attempt }}
          --ttl-minutes 30
          --github-env

      # The same dbmate as the root devDependency; a direct connection, not the pooler
      - name: Apply migrations to the copy
        run: npx --yes dbmate@2.37.0 --url "$DATABASE_URL_DIRECT" --migrations-dir db/migrations --no-dump-schema up

      - name: Delete Neon branch
        if: always() && env.NEON_BRANCH_ID != ''
        run: python3 scripts/neon_branch.py delete "$NEON_BRANCH_ID"

  migrate:
    needs: rehearse
    runs-on: ubuntu-latest
    # Production's connection string lives in this environment, which only main can deploy to
    environment: neon-production
    env:
      # The direct (non-pooled) connection string for the production branch
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Until the environment has its secret (set at cutover), there's nothing to migrate
      - name: Check for the production connection string
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::neon-production has no DATABASE_URL secret yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run migrations
        if: steps.ready.outputs.ready == 'true'
        run: npx --yes dbmate@2.37.0 --migrations-dir db/migrations --no-dump-schema up
