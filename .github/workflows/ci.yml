name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Matches backend/Dockerfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # conftest.py fakes the Supabase env vars and mocks the client, so no secrets are needed
      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    env:
      # Placeholders: src/lib/supabase.ts throws at import without them. Tests mock the network.
      VITE_SUPABASE_URL: https://fake.supabase.co
      VITE_SUPABASE_ANON_KEY: fake-anon-key
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Every story: render, play function and axe a11y checks
      - name: Storybook tests
        run: pnpm test:storybook

      - name: Build
        run: pnpm build
