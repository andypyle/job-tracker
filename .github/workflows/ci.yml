name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The tests run real SQL. Same major version as the Neon project; conftest.py stands in for
    # Neon Auth's tables and applies db/migrations.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Matches backend/Dockerfile
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The app's dependencies plus the test tools
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Neon Auth and Object Storage are faked or patched, so no secrets are needed
      - name: Run tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/jobtracker_test

  # What the backend job's stand-ins can't cover, on a throwaway Neon branch of production:
  # the migrations against Neon's real schema (including the neon_auth tables our triggers sit
  # on), then live smoke tests with real Neon Auth tokens and Object Storage (backend/smoke).
  # The branch copies production, but only throwaway users are created and it's deleted after;
  # it also expires on its own in case the job dies first.
  # Only on pushes to main and manual runs (Actions > CI > Run workflow, on any branch), to keep
  # the NEON_API_KEY secret out of PR runs. Run it by hand on a branch that touches migrations.
  neon:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # Sets NEON_BRANCH_ID, DATABASE_URL(_DIRECT), NEON_AUTH_BASE_URL and the AWS_* storage settings
      - name: Create Neon branch
        run: >-
          python scripts/neon_branch.py create
          --parent production
          --name ci-${{ github.run_id }}-${{ github.run_attempt }}
          --ttl-minutes 60
          --storage-credential
          --github-env

      # The same dbmate as the root devDependency; a direct connection, not the pooler
      - name: Apply migrations
        run: npx --yes dbmate@2.37.0 --url "$DATABASE_URL_DIRECT" --migrations-dir db/migrations --no-dump-schema up

      - name: Smoke tests
        working-directory: backend
        run: pytest smoke

      - name: Delete Neon branch
        if: always() && env.NEON_BRANCH_ID != ''
        run: python scripts/neon_branch.py delete "$NEON_BRANCH_ID"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    env:
      # Placeholder: src/lib/auth.ts throws at import without it. Tests mock the network.
      VITE_NEON_AUTH_URL: https://auth.test.invalid/neondb/auth
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc -p e2e

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Every story: render, play function and axe a11y checks
      - name: Storybook tests
        run: pnpm test:storybook

      - name: Build
        run: pnpm build

  # The real stack: a throwaway Neon branch of dev (synthetic data and the seeded demo; never
  # production, and e2e/fixtures.ts refuses a database with real users), the FastAPI backend and
  # a production build of the frontend, which Playwright starts (see playwright.config.ts).
  # Needs NEON_API_KEY, so like the neon job it runs on pushes to main and manual runs only.
  e2e:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets NEON_BRANCH_ID, DATABASE_URL(_DIRECT), NEON_AUTH_BASE_URL and the AWS_* storage settings
      - name: Create Neon branch
        run: >-
          python scripts/neon_branch.py create
          --parent dev
          --name e2e-${{ github.run_id }}-${{ github.run_attempt }}
          --ttl-minutes 60
          --storage-credential
          --github-env

      # dev already has the applied migrations; this adds any new ones
      - name: Apply migrations
        run: pnpm exec dbmate --url "$DATABASE_URL_DIRECT" --migrations-dir db/migrations --no-dump-schema up

      - name: Install Playwright Chromium
        working-directory: packages/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: packages/frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/frontend/playwright-report/
            packages/frontend/test-results/
          retention-days: 7

      - name: Delete Neon branch
        if: always() && env.NEON_BRANCH_ID != ''
        run: python scripts/neon_branch.py delete "$NEON_BRANCH_ID"
